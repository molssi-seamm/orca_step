name: test

channels:
  - conda-forge

dependencies:
  # Base depends
  - python
  - pip

  # SEAMM
  - seamm

  # Dependencies
  - basis_set_exchange
  # orca_step (energy.py) uses the bibtexparser 1.x API (bwriter.BibTexWriter),
  # which 2.x removed; unpinned, conda brings in 2.x and the docs build fails.
  - bibtexparser<2
  - tabulate

  # Testing
  - black
  - codecov
  - flake8
  - pytest
  - pytest-cov

  # Documentation
  - pydata-sphinx-theme
  - sphinx-design

  # Pip-only installs
  - pip:
    - seamm-exec
    - seamm-bsse
    # Documentation
    - sphinx-copybutton
    - sphinxnotes-strike
